function useFitScale(deps) {
  const outer = React.useRef(null);
  const inner = React.useRef(null);
  const [scale, setScale] = useState(1);

  React.useLayoutEffect(() => {
    const measure = () => {
      if (!outer.current || !inner.current) return;
      const avail = outer.current.clientHeight;
      // Measure at 1:1, otherwise the previous factor skews the reading.
      inner.current.style.zoom = 1;
      inner.current.style.height = "auto";
      const natural = inner.current.scrollHeight;
      if (!avail || !natural) return;
      const next = Math.min(1.6, Math.max(1, (avail / natural) * 0.995));
      setScale(Number(next.toFixed(3)));
    };
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [deps]);

  return [outer, inner, scale];
}

  if (slot.protocol === "negativas") return `${w}${slot.targetReps} rep + ${slot.targetNegatives ?? 0} neg`;
  if (slot.protocol === "rest_pause") return `${w}${slot.targetReps} rep + ${slot.targetExtra1 ?? 0} + ${slot.targetExtra2 ?? 0} RP`;
  return `${w}${slot.targetReps} reps`;
}

function calcOneRM(weight, reps) {
  const w = Number(weight);
  const r = Number(reps);
  if (!w || !r) return null;
  return Math.round(w * (1 + r / 30) * 10) / 10;
}

function MetaRow({ slot }) {
  const unit = slot.weightUnit || "kg";
  const weightText = slot.targetWeight != null && slot.targetWeight !== "" ? `${slot.targetWeight}${unit}` : "";
  let rest;
  if (slot.timeBased) rest = <>{slot.targetSeconds}s (hold)</>;
  else if (slot.protocol === "negativas") rest = <>{slot.targetReps} rep + {slot.targetNegatives ?? 0} neg</>;
  else if (slot.protocol === "rest_pause") rest = (
    <>{slot.targetReps} rep + {slot.targetExtra1 ?? 0} + {slot.targetExtra2 ?? 0} <span style={{ fontSize: "1.2em", color: "#C81E3A", fontWeight: 700 }}>RP</span></>
  );
  else rest = <>{slot.targetReps} reps</>;
  const oneRM = slot.timeBased ? null : calcOneRM(slot.targetWeight, slot.targetReps);
  return (
    <span>{weightText} {rest}{oneRM ? <> (<b>{oneRM}{unit}</b>)</> : ""}</span>
  );
}

function buildDefaultRoutineConfig(levelKey = DEFAULT_LEVEL) {
  const cfg = {};
  const routines = getRoutines(levelKey);
  getCycle(levelKey).forEach((key) => {
    cfg[key] = routines[key].slots.map((s) => ({
      slotId: s.id,
      exercise: s.options[0],
      protocol: s.isPreagotamiento ? "fallo" : (s.defaultProtocol || "rest_pause"),
      timeBased: !!s.isTimeBased,
      weightUnit: s.weightUnit || "kg",
      targetWeight: s.defaultWeight ?? "",
      targetReps: s.defaultReps ?? 8,
      targetNegatives: s.defaultNegatives ?? 2,
      targetExtra1: s.defaultExtra1 ?? 3,
      targetExtra2: s.defaultExtra2 ?? 3,
      targetSeconds: s.defaultSeconds ?? 30,
      note: "",
    }));
  });
  // Personal notes (seat positions) only apply to the intermediate setup.
  if (levelKey === "intermediate") {
    cfg.A[1].note = "Seat pos. 3";
    cfg.B[0].note = "Seat pos. 7";
  }
  return cfg;
}

// Minimal starter data for a brand-new user: just enough points that the charts
// render something instead of an empty state. Uses ~60% of each target as a start.
function buildStarterWorkouts(levelKey) {
  const routines = getRoutines(levelKey);
  const cycle = getCycle(levelKey);
  const cfg = buildDefaultRoutineConfig(levelKey);
  const out = [];
  const SESSIONS = 4; // one full cycle back
  for (let s = SESSIONS; s >= 1; s--) {
    cycle.forEach((key, ki) => {
      const daysAgo = (s - 1) * cycle.length * 4 + (cycle.length - ki) * 4;
      const date = new Date(Date.now() - daysAgo * 86400000).toISOString();
      const ramp = 0.6 + (SESSIONS - s) * 0.08; // gets closer to target each cycle
      out.push({
        id: `starter-${key}-${s}`,
        date,
        routine: key,
        entries: cfg[key].map((slot) => {
          const w = Number(slot.targetWeight) || 0;
          return {
            slotId: slot.slotId,
            exercise: slot.exercise,
            protocol: slot.protocol,
            timeBased: slot.timeBased,
            weightUnit: slot.weightUnit,
            weight: String(Math.round(w * ramp * 2) / 2),
            reps: slot.timeBased ? 0 : slot.targetReps,
            negatives: slot.protocol === "negativas" ? String(slot.targetNegatives) : "",
            repsBreakdown: slot.protocol === "rest_pause"
              ? [String(slot.targetReps), String(slot.targetExtra1), String(slot.targetExtra2)]
              : ["", "", ""],
            seconds: slot.timeBased ? String(Math.round(slot.targetSeconds * ramp)) : "",
          };
        }),
      });
    });
  }
  return out;
}

function buildStarterBodystats() {
  const out = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(Date.now() - i * 16 * 86400000).toISOString().slice(0, 10);
    out.push({ id: `starter-bs-${i}`, date: d, weight: 75 + (5 - i) * 0.6, bodyFat: 18 - (5 - i) * 0.2 });
  }
  return out;
}

// A plain, balanced starting diet (~2500 kcal) so a new user has something to
// edit rather than four empty screens. Values come from FOOD_DB per 100 g.
function starterItem(dbName, qty, id) {
  const f = FOOD_DB.find((x) => x.n === dbName);
  if (!f) return null;
  const v = scaleFood(f, qty);
  return {
    id,
    name: foodLabel(f),
    amount: f.u === "u" ? String(qty) : `${qty} g`,
    calories: v.calories, carbs: v.carbs, protein: v.protein, fat: v.fat, fiber: v.fiber,
    notes: "",
  };
}

function buildStarterMealPlans() {
  const spec = {
    A: [["Oats", 80], ["Whole milk", 250], ["Banana", 120], ["Peanut butter", 20]],
    B: [["Chicken breast", 180], ["White rice, raw", 100], ["Mixed vegetables", 150], ["Olive oil", 10]],
    C: [["Greek yogurt", 200], ["Almonds", 30], ["Apple", 150]],
    D: [["Beef, lean", 150], ["Potato", 250], ["Broccoli", 150], ["Olive oil", 10]],
  };
  return MEAL_KEYS.reduce((acc, k) => {
    const items = (spec[k] || [])
      .map(([n, q], i) => starterItem(n, q, `starter-${k}${i}`))
      .filter(Boolean);
    acc[k] = { label: "", items };
    return acc;
  }, {});
}

function foodLabel(f) {
  return CURRENT_LANG === "es" ? f.es : f.n;
}

function searchFoods(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const hit = (f) => (f.n + " " + f.es).toLowerCase().includes(q);
  const starts = (f) => foodLabel(f).toLowerCase().startsWith(q);
  return FOOD_DB.filter(hit)
    .sort((a, b) => (starts(b) ? 1 : 0) - (starts(a) ? 1 : 0))
    .slice(0, 8);
}

// Scale a database entry (per 100 g, or per unit) to the requested amount.
// All nutrition figures are shown and stored as whole numbers: tenths of a gram
// are noise given that portion sizes are estimates, and float sums would
// otherwise surface as 96.30000000000001.
function n1(v) {
  return Math.round(Number(v) || 0);
}

function scaleFood(f, qty) {
  const n = Number(qty) || 0;
  const factor = f.u === "u" ? n : n / 100;
  const r0 = (v) => Math.round(v * factor);
  return {
    calories: Math.round(f.k * factor),
    carbs: r0(f.c), protein: r0(f.p), fat: r0(f.f), fiber: r0(f.fb),
  };
}

const LS_PREFIX = "heavyduty:";

function lsGet(key) {
  const raw = localStorage.getItem(LS_PREFIX + key);
  return raw === null ? null : JSON.parse(raw);
}
function lsSet(key, value) {
  localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
}

function useStorage(key, fallback) {
  const [value, setValue] = useState(fallback);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    try {
      const stored = lsGet(key);
      if (stored !== null) setValue(stored);
    } catch (e) { /* not set yet */ }
    setLoaded(true);
  }, [key]);
  const persist = async (next) => {
    setValue(next);
    try {
      lsSet(key, next);
    } catch (e) {
      console.error(e);
      alert(t("saveError"));
    }
  };
  return [value, persist, loaded];
}

function getPrevRecord(workouts, routineKey, slotId) {
  const sessions = workouts.filter((w) => w.routine === routineKey).sort((a, b) => new Date(b.date) - new Date(a.date));
  for (const s of sessions) {
    const e = s.entries.find((en) => en.slotId === slotId);
    if (e) return { entry: e, date: s.date };
  }
  return null;
}

function PrevRecordLine({ workouts, routineKey, slotId, oneLine }) {
  const rec = getPrevRecord(workouts, routineKey, slotId);
  if (!rec) return null;
  const { entry: e, date } = rec;
  const unit = e.weightUnit || "kg";
  let rest;
  if (e.timeBased) rest = <>{e.seconds}s (hold)</>;
  else if (e.protocol === "negativas") rest = <>{e.reps} rep + {e.negatives || 0} neg</>;
  else if (e.protocol === "rest_pause") rest = <>{(e.repsBreakdown || []).filter(Boolean).reduce((a, v) => a + Number(v), 0) || e.reps} rep ({(e.repsBreakdown || []).join("+")})</>;
  else rest = <>{e.reps} reps</>;
  // Same rule as the targets: positives only, never the rest-pause extras.
  const positiveReps = e.protocol === "rest_pause" && e.repsBreakdown
    ? Number(e.repsBreakdown[0]) || 0
    : Number(e.reps) || 0;
  const oneRM = e.timeBased ? null : calcOneRM(e.weight, positiveReps);
  return (
    <span className="mono" style={{ fontSize: oneLine ? 10 : 11, color: "#8A8D93", marginTop: oneLine ? 0 : 4, display: oneLine ? "inline" : "block", whiteSpace: oneLine ? "nowrap" : undefined }}>
      {oneLine ? "▲ " : `${t("previousRecord")}: `}<span>{e.weight}{unit} {rest}</span>
      {oneRM ? <> (<b>{oneRM}{unit}</b>)</> : ""} ({fmtDate(date)})
    </span>
  );
}

      <SectionLabel>{t("importData")}</SectionLabel>
      <div style={{ ...card, marginBottom: 24 }}>
        <p className="mono" style={{ fontSize: px(11), color: "#8A8D93", margin: "0 0 10px", lineHeight: 1.5 }}>{t("importHint")}</p>
        <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }}
          onChange={(e) => { onImport(e.target.files[0]); e.target.value = ""; }} />
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{ ...btnGhost, width: "100%" }}>
          <Upload size={px(16)} /> {t("importData")}
        </button>
      </div>

      <button onClick={onReset} style={{ ...btnGhost, width: "100%", color: "#C81E3A", borderColor: "#C81E3A" }}>
        <Trash2 size={px(16)} /> {t("resetApp")}
      </button>

      {/* Which build is actually running — settles "did my upload land?". */}
      <div className="mono" style={{ fontSize: px(10), color: "#3A3F47", textAlign: "center", marginTop: 14 }}>build {BUILD}</div>
    </div>
  );
}

// ---------------- APP ----------------
function App() {
  const [tab, setTab] = useState("food");
  const [settings, setSettings, sLoaded] = useStorage(STORAGE_KEYS.settings, { lastRoutineIndex: 1, level: DEFAULT_LEVEL, onboarded: false, lang: null });
  const [workouts, setWorkouts, wLoaded] = useStorage(STORAGE_KEYS.workouts, SEED_WORKOUTS);
  const [routineConfig, setRoutineConfig, rLoaded] = useStorage(STORAGE_KEYS.routineConfig, buildDefaultRoutineConfig());
  const [mealPlans, setMealPlans, mLoaded] = useStorage(STORAGE_KEYS.mealPlans, DEFAULT_MEAL_PLANS);
  const [bodystats, setBodystats, bLoaded] = useStorage(STORAGE_KEYS.bodystats, SEED_BODYSTATS);
  const [notes, setNotes, nLoaded] = useStorage(STORAGE_KEYS.notes, "");
  const ready = sLoaded && wLoaded && rLoaded && mLoaded && bLoaded && nLoaded;
  const [showSettings, setShowSettings] = useState(false);
  const isWide = useIsWide();
  const railShown = isWide && ready && settings.lang && settings.onboarded;
  CURRENT_LANG = settings.lang || "en";
  SCALE = isWide ? 1.23 : 1.2;

  const pickLang = async (lang) => { await setSettings({ ...settings, lang }); };

  const exportData = () => {
    const dump = {};
    Object.entries(STORAGE_KEYS).forEach(([name, key]) => { dump[name] = lsGet(key); });
    dump.__exportedAt = new Date().toISOString();
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `heavyduty-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importData = (file) => {
    if (!file) return;
    if (!confirm(t("importConfirm"))) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        Object.entries(STORAGE_KEYS).forEach(([name, key]) => {
          if (parsed[name] !== undefined && parsed[name] !== null) lsSet(key, parsed[name]);
        });
        alert(t("importOk"));
        location.reload();
      } catch (e) { alert(t("importFail")); }
    };
    reader.readAsText(file);
  };

  const resetApp = () => {
    if (!confirm(t("resetConfirm"))) return;
    Object.values(STORAGE_KEYS).forEach((key) => localStorage.removeItem(LS_PREFIX + key));
    location.reload();
  };

  // New user picked a level: wipe the personal seed data and start near-empty,
  // keeping only enough sample points for the charts to render.
  const pickLevel = async (levelKey) => {
    await setRoutineConfig(buildDefaultRoutineConfig(levelKey));
    await setWorkouts(buildStarterWorkouts(levelKey));
    await setBodystats(buildStarterBodystats());
    await setMealPlans(buildStarterMealPlans());
    await setNotes("");
    await setSettings({ ...settings, lastRoutineIndex: getCycle(levelKey).length - 1, level: levelKey, onboarded: true });
    setTab("food");
  };

  return (
    <div style={{ background: "#14161A", minHeight: "100vh", color: "#E8E6E1", fontFamily: "'Arial Narrow', Arial, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        .disp { font-family: 'Oswald', Arial, sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        * { box-sizing: border-box; }
        input, select, textarea { font-family: inherit; }
        /* No spinners: the arrows are easy to nudge by accident and invite
           changing a figure with the mouse instead of typing it. */
        input[type=number] { -moz-appearance: textfield; appearance: textfield; }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        /* Buttons don't inherit color by default — without this they render
           with the system's black button text once deployed outside the preview. */
        button { color: inherit; font-family: inherit; }
        /* Height available to a screen: viewport minus header, nav bar and main padding.
           dvh follows the mobile browser chrome as it hides/shows. */
        /* Measured from the real header/nav paddings; the nav grows with the
           phone's gesture bar, so its inset is part of the calculation. */
        :root {
          /* Everything vertical is measured against --hd-vh instead of 100dvh:
             when the desktop layout is zoomed, the viewport it can use shrinks
             by the same factor, otherwise the fixed-height screens overflow. */
          --hd-vh: 100dvh;
          --hd-header: 53px;
          --hd-nav: calc(64px + max(0px, env(safe-area-inset-bottom) - 8px));
          --hd-mainpad: 12px; /* only main's top padding reduces the visible area */
        }
        /* The content area owns the scrolling and has an exact height, so the
           bottom nav stays put and nothing ever slides under it. */
        html, body { overflow: hidden; overscroll-behavior: none; }
        .hd-main {
          height: calc(var(--hd-vh) - var(--hd-header) - var(--hd-nav));
          box-sizing: border-box;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
        }
        /* A screen that fills exactly the visible area, no more, no less.
           Sized from the viewport rather than the parent: a percentage height
           collapses when any ancestor is auto-height. */
        .fill-screen {
          display: flex;
          flex-direction: column;
          height: calc(var(--hd-vh) - var(--hd-header) - var(--hd-nav) - var(--hd-mainpad));
          min-height: 320px;
        }
        .fill-screen > .grow { flex: 0 1 auto; min-height: 0; overflow: hidden; }

        /* ---------- Desktop: side rail instead of a bottom bar ---------- */
        @media (min-width: 900px) {
          /* Reads a touch small at 100% on a desktop screen; this matches
             setting the browser zoom to 110%. */
          :root { --hd-nav: 0px; }
          .hd-shell { display: flex; height: var(--hd-vh); }
          .hd-side {
            width: 232px; flex-shrink: 0; background: #1E2126;
            border-right: 1px solid #2A2D33; display: flex; flex-direction: column;
            padding: 22px 14px;
          }
          .hd-side .side-btn {
            display: flex; align-items: center; gap: 12px; width: 100%;
            background: none; border: none; padding: 12px 13px; cursor: pointer;
            text-align: left; border-left: 3px solid transparent;
          }
          .hd-side .side-btn.active { background: #14161A; border-left-color: #C81E3A; }
          .hd-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
          .hd-main.no-header { height: var(--hd-vh); }
          /* One column when narrow, two once there is room. Capped at two on
             purpose: a 4-item cycle in three columns leaves a stranded card. */
          .wide-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
          .wide-grid > .grow { flex: none; overflow: visible; }
          .fill-screen.wide-grid { height: auto; min-height: 0; }
          .side-col { margin-top: 18px; }
          /* Food fits one screen: the meals take whatever height is left and
             the day's totals stay pinned at the bottom. main's vertical
             padding is 22px + 28px. */
          .food-screen {
            display: flex;
            flex-direction: column;
            height: calc(var(--hd-vh) - 50px);
          }
          .food-screen > .wide-grid { flex: 1 1 0; min-height: 0; }
          /* A long meal scrolls its food list rather than pushing the totals
             off screen: the list scrolls, the totals stay at the foot. */
          .food-screen > .wide-grid > *,
          .split-layout > .wide-grid > * { overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
          .inline-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
          .inline-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
          /* The log form is meant to fit the days column outright — every field
             visible at once, no scrolling while you are mid-session. */
          .log-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 0; overflow: hidden; }
          .log-body > * { flex: 0 0 auto; }
          .food-screen > .food-totals { flex-shrink: 0; }
        }
        /* Only once there is genuinely room: days left, history in a side column. */
        @media (min-width: 1024px) {
          .wide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (min-width: 1150px) {
          /* Days on the left, history on the right — both inside one screen.
             Each side scrolls on its own instead of growing the page. */
          .split-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 330px;
            gap: 18px;
            height: calc(var(--hd-vh) - 50px);
          }
          .split-layout > .wide-grid { min-height: 0; }
          .split-layout > .wide-grid > * { min-height: 0; }
          .side-col { margin-top: 0; min-height: 0; overflow-y: auto; padding-right: 4px; }
          .split-left { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
          /* Progress has a tab strip above the split, so the split takes the
             leftover height instead of assuming it owns the whole screen. */
          .prog-screen { display: flex; flex-direction: column; height: calc(var(--hd-vh) - 50px); }
          .prog-screen > .split-layout { height: auto; flex: 1 1 auto; min-height: 0; }
          /* The chart takes whatever height the controls above it leave over. */
          .chart-fill { flex: 1 1 0; min-height: 180px; display: flex; flex-direction: column; overflow: hidden; }
          .chart-fill > .chart-area { flex: 1 1 auto; min-height: 0; }
          .split-left > *:not(.chart-fill) { flex-shrink: 0; }
        }
        @media (min-width: 1360px) {
          .split-layout { grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; }
          .wide-grid { gap: 18px; }
        }
        ::selection { background: #C81E3A; color: #fff; }

        /* Scrollbars in the app's own palette instead of the OS default. */
        * { scrollbar-width: thin; scrollbar-color: #3A3F47 transparent; }
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
          background: #3A3F47;
          border: 2px solid transparent;
          background-clip: content-box;
          border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #C81E3A; background-clip: content-box; }
        ::-webkit-scrollbar-corner { background: transparent; }
      `}</style>

      <div className={isWide ? "hd-shell" : undefined}>
      {isWide && ready && settings.lang && settings.onboarded && (
        <aside className="hd-side">
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "0 12px 22px" }}>
            <div style={{ width: 6, height: 26, background: "#C81E3A" }} />
            <span className="disp" style={{ fontSize: px(20), fontWeight: 700, letterSpacing: 1, textTransform: "uppercase" }}>Heavy Duty</span>
          </div>
          <SideBtn icon={<Utensils size={px(18)} />} label={t("food")} active={tab === "food"} onClick={() => setTab("food")} />
          <SideBtn icon={<Flame size={px(18)} />} label={t("train")} active={tab === "train"} onClick={() => setTab("train")} />
          <SideBtn icon={<TrendingUp size={px(18)} />} label={t("progress")} active={tab === "progress"} onClick={() => setTab("progress")} />
          <SideBtn icon={<BookOpen size={px(18)} />} label={t("books")} active={tab === "books"} onClick={() => setTab("books")} />
          <div style={{ flex: 1 }} />
          <SideBtn icon={<Settings2 size={px(18)} />} label={t("settings")} active={showSettings} onClick={() => setShowSettings((v) => !v)} />
        </aside>
      )}
      <div className={isWide ? "hd-body" : undefined}>
      <header style={{ padding: "14px 16px 12px", borderBottom: "1px solid #2A2D33", display: railShown ? "none" : "block" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 6, height: 26, background: "#C81E3A" }} />
          <h1 className="disp" style={{ fontSize: px(22), fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", margin: 0, flex: 1 }}>Heavy Duty</h1>
          {ready && settings.lang && settings.onboarded && (
            <button onClick={() => setShowSettings((v) => !v)} aria-label={t("settings")}

      <main className={"hd-main" + (railShown ? " no-header" : "")} style={{ padding: isWide ? "22px 28px 28px" : "12px 12px 14px", maxWidth: isWide ? 2000 : 560, margin: "0 auto", width: "100%" }}>

        ) : (

      </main>

      </div>
      </div>

      {!isWide && ready && settings.lang && settings.onboarded && !showSettings && (
        <nav style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#1E2126", borderTop: "1px solid #2A2D33", display: "flex", padding: "8px 0 max(8px, env(safe-area-inset-bottom))" }}>
          <NavBtn icon={<Utensils size={px(19)} />} label={t("food")} active={tab === "food"} onClick={() => setTab("food")} />
          <NavBtn icon={<Flame size={px(19)} />} label={t("train")} active={tab === "train"} onClick={() => setTab("train")} />
          <NavBtn icon={<TrendingUp size={px(19)} />} label={t("progress")} active={tab === "progress"} onClick={() => setTab("progress")} />
          <NavBtn icon={<BookOpen size={px(19)} />} label={t("books")} active={tab === "books"} onClick={() => setTab("books")} />
        </nav>
      )}
    </div>
  );
}

// ---------------- TRAINING ----------------
function Training({ settings, setSettings, workouts, setWorkouts, routineConfig, setRoutineConfig }) {
  const isWide = useIsWide();
  const level = settings.level || DEFAULT_LEVEL;
  const cycle = getCycle(level);
  const routines = getRoutines(level);
  const [screen, setScreen] = useState({ mode: "list" });
  const [expandedHistory, setExpandedHistory] = useState(null);
  const [historyOpen, setHistoryOpen] = useState(false);
  const [fitOuter, fitInner, fitScale] = useFitScale(JSON.stringify(routineConfig) + historyOpen);
  // With a column of its own there is no reason to keep the history folded.
  useEffect(() => { if (isWide) setHistoryOpen(true); }, [isWide]);
  const suggestedRoutine = cycle[(settings.lastRoutineIndex + 1) % cycle.length];

  // The same figures, written to the routine instead of the history. Blank
  // fields are left as they were rather than wiped.
  const saveTargets = async (routineKey, entries) => {
    const next = routineConfig[routineKey].map((slot) => {
      const e = entries.find((x) => x.slotId === slot.slotId);
      if (!e) return slot;
      const num = (v, fallback) => (v === "" || v === null || v === undefined ? fallback : Number(v));
      return {
        ...slot,
        targetWeight: num(e.weight, slot.targetWeight),
        targetReps: e.timeBased ? slot.targetReps
          : (e.protocol === "rest_pause" ? num(e.repsBreakdown[0], slot.targetReps) : num(e.reps, slot.targetReps)),
        targetNegatives: e.protocol === "negativas" ? num(e.negatives, slot.targetNegatives) : slot.targetNegatives,
        targetExtra1: e.protocol === "rest_pause" ? num(e.repsBreakdown[1], slot.targetExtra1) : slot.targetExtra1,
        targetExtra2: e.protocol === "rest_pause" ? num(e.repsBreakdown[2], slot.targetExtra2) : slot.targetExtra2,
        targetSeconds: e.timeBased ? num(e.seconds, slot.targetSeconds) : slot.targetSeconds,
      };
    });
    await setRoutineConfig({ ...routineConfig, [routineKey]: next });
    setScreen({ mode: "list" });
  };

  const finishLog = async (routineKey, entries) => {
    const nextIdx = cycle.indexOf(routineKey);
    await setWorkouts([...workouts, { id: "w" + Date.now(), date: new Date().toISOString(), routine: routineKey, entries }]);
    await setSettings({ ...settings, lastRoutineIndex: nextIdx });
    setScreen({ mode: "list" });
  };

  // On desktop every day is already laid out on the main screen, so leaving a
  // sub-screen returns straight there instead of to a single-day view.
  const backFromSub = () => setScreen({ mode: "list" });

  // On desktop logging happens in the days column, so the history stays put
  // beside it — that is exactly what you compare against while filling it in.
  if (screen.mode === "log" && !isWide) {
    return <LogSession routineKey={screen.key} config={routineConfig[screen.key]} workouts={workouts} level={level} onCancel={backFromSub} onFinish={finishLog} onSaveTargets={saveTargets} />;
  }
  const loggingKey = isWide && screen.mode === "log" ? screen.key : null;
  return (
    <div className={isWide ? "split-layout" : undefined}>
      {/* Days on the left; on a wide screen the history gets its own column
          instead of sitting far below the fold. */}
      {loggingKey ? (
        <div style={{ ...card, padding: "12px 14px", minHeight: 0, display: "flex", flexDirection: "column" }}>
          <LogSession
            routineKey={loggingKey} config={routineConfig[loggingKey]} workouts={workouts} level={level} inline
            onCancel={() => setScreen({ mode: "list" })}
            onFinish={finishLog}
            onSaveTargets={saveTargets}
          />
        </div>
      ) : (
      <div ref={isWide ? undefined : fitOuter} className={isWide ? "wide-grid" : (historyOpen ? undefined : "fill-screen")}>
      <div ref={isWide ? undefined : fitInner}
        style={isWide ? undefined : { zoom: fitScale, height: `calc(100% / ${fitScale})`, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
      {/* Desktop: every day is laid out in full, editable in place, so nothing
          needs to be opened just to be read. Mobile keeps the compact summary. */}
      {isWide ? cycle.map((key) => (
        <div key={key} onClick={() => setScreen({ mode: "log", key })}
          style={{ ...card, padding: "12px 14px", cursor: "pointer" }}>
          <RoutineView
            routineKey={key} config={routineConfig[key]} workouts={workouts} level={level} inline readOnly
            suggested={key === suggestedRoutine}
          />
        </div>
      )) : cycle.map((key) => (
        <button key={key} onClick={() => setScreen({ mode: "log", key })}
          className={isWide ? undefined : (historyOpen ? undefined : "grow")}
          style={{ ...card, padding: isWide ? 14 : "9px 11px", marginBottom: isWide ? 0 : 8, width: "100%", textAlign: "left", cursor: "pointer", display: "block" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 7, minWidth: 0 }}>
                <span className="disp" style={{ fontSize: px(18), fontWeight: 700, textTransform: "uppercase", flexShrink: 0 }}>{t("day")} {key}</span>
                <span className="disp" style={{ fontSize: px(12), fontWeight: 700, color: "#C81E3A", textTransform: "uppercase", letterSpacing: 0.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{tx(routines[key].label)}</span>
                {key === suggestedRoutine && (
                  <span className="mono" style={{ fontSize: px(9), color: "#C81E3A", border: "1px solid #C81E3A", padding: "1px 5px", letterSpacing: 0.5, flexShrink: 0 }}>{t("suggested")}</span>
                )}
              </div>
            </div>
            <ChevronRight size={px(18)} color="#8A8D93" style={{ flexShrink: 0 }} />
          </div>
          <div style={{ marginTop: 5 }}>
            {getGroups(key, level).map((groupIds, gi) => (
              <div key={gi} style={{ marginTop: gi > 0 ? 4 : 0, paddingLeft: 7,
                                     // Transparent border on non-supersets keeps every row on the
                                     // same left edge, so the weight column never shifts.
                                     borderLeft: "2px solid " + (groupIds.length > 1 ? "#C81E3A" : "transparent") }}>
                {groupIds.map((slotId) => {
                  const slot = routineConfig[key].find((s) => s.slotId === slotId);
                  return (
                    <div key={slotId} style={{ display: "grid", gridTemplateColumns: `${px(104)}px 1fr`, gap: 10, marginTop: 1 }}>
                      <span className="mono" style={{ fontSize: px(11), color: "#8A8D93", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{shortName(slot.exercise)}</span>
                      <span className="mono" style={{ fontSize: px(11), color: "#8A8D93", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}><MetaRow slot={slot} /></span>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </button>
      ))}

      </div>
      </div>
      )}

      <div className={isWide ? "side-col" : undefined}
        style={{ marginTop: isWide ? undefined : (historyOpen ? 18 : 4), flexShrink: 0 }}>
        <button onClick={() => setHistoryOpen((v) => !v)} style={{ width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <SectionLabel>{t("history")}</SectionLabel>
          <ChevronDown size={px(16)} color="#8A8D93" style={{ transform: historyOpen ? "rotate(180deg)" : "none" }} />
        </button>
        {historyOpen && (
          <>
            {workouts.length === 0 && <p className="mono" style={{ color: "#8A8D93", fontSize: px(12) }}>{t("noSessions")}</p>}
            {workouts.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).map((w) => {
              const isOpen = expandedHistory === w.id;
              return (
                <div key={w.id} style={{ ...card, marginBottom: 8, padding: 0, overflow: "hidden" }}>
                  <button onClick={() => setExpandedHistory(isOpen ? null : w.id)} style={{ width: "100%", background: "none", border: "none", padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: "inherit" }}>
                    <span className="disp" style={{ fontSize: px(14), textTransform: "uppercase" }}>Day {w.routine}</span>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span className="mono" style={{ fontSize: px(11), color: "#8A8D93" }}>{fmtDateTime(w.date)}</span>
                      <ChevronDown size={px(14)} color="#8A8D93" style={{ transform: isOpen ? "rotate(180deg)" : "none" }} />
                    </div>
                  </button>
                  {isOpen && (
                    <div style={{ padding: "0 14px 14px" }}>
                      {w.entries.map((e, i) => {
                        const positiveReps = e.protocol === "rest_pause" && e.repsBreakdown
                          ? Number(e.repsBreakdown[0]) || 0
                          : Number(e.reps) || 0;
                        const oneRM = e.timeBased ? null : calcOneRM(e.weight, positiveReps);
                        return (
                          <div key={i} style={{ borderTop: "1px solid #2A2D33", padding: "8px 0" }}>
                            <div className="disp" style={{ fontSize: px(13) }}>{e.exercise}</div>
                            <div className="mono" style={{ fontSize: px(11), color: "#8A8D93", marginTop: 2 }}>
                              {e.weight ? `${e.weight}${e.weightUnit || "kg"} · ` : ""}
                              {e.timeBased
                                ? `${e.seconds || 0}s (${t("hold")})`
                                : e.protocol === "rest_pause" && e.repsBreakdown
                                ? `${e.repsBreakdown.filter((r) => r).join(" + ")} ${t("repsWord")} (rest-pause)`
                                : `${e.reps || 0} ${t("positive")}${e.negatives ? ` + ${e.negatives} ${t("slowNegatives")}` : ""}`}
                              {oneRM ? <> (<b>{oneRM}{e.weightUnit || "kg"}</b>)</> : ""}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
  );
}

// One exercise, editable in place: pick the movement, the protocol and the
// numbers that protocol actually needs.
function SlotRowEditor({ slot, slotDef, onChange, onDelete, onDone }) {
  const [draft, setDraft] = useState(slot);
  const set = (patch) => {
    const next = { ...draft, ...patch };
    setDraft(next);
    onChange(next);
  };
  const numStyle = { ...input, padding: "5px 6px", fontSize: px(13), width: "100%", textAlign: "center" };
  const Field = ({ label, children }) => (
    <label style={{ display: "block" }}>
      <span className="mono" style={{ fontSize: px(9), color: "#8A8D93", display: "block", textAlign: "center", marginBottom: 1 }}>{label}</span>
      {children}
    </label>
  );

  return (
    <div style={{ ...card, marginBottom: 4, padding: "8px 10px", border: "1px solid #C81E3A" }}>
      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
        <select value={draft.exercise} onChange={(e) => set({ exercise: e.target.value })}
          style={{ ...input, padding: "5px 8px", fontSize: px(14), flex: 1, minWidth: 0 }}>
          {(slotDef?.options || [draft.exercise]).map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
        <button onClick={onDone} style={{ background: "none", border: "none", color: "#C81E3A", cursor: "pointer", padding: 4 }}><Check size={px(17)} /></button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr 1fr", gap: 5, marginTop: 6 }}>
        <Field label={`${t("weight")} (${draft.weightUnit || "kg"})`}>
          <input type="number" className="mono" value={draft.targetWeight ?? ""}
            onChange={(e) => set({ targetWeight: e.target.value === "" ? "" : Number(e.target.value) })} style={numStyle} />
        </Field>

        {draft.timeBased ? (
          <Field label={t("seconds")}>
            <input type="number" className="mono" value={draft.targetSeconds ?? ""}
              onChange={(e) => set({ targetSeconds: e.target.value === "" ? "" : Number(e.target.value) })} style={numStyle} />
          </Field>
        ) : (
          <Field label={t("reps")}>
            <input type="number" className="mono" value={draft.targetReps ?? ""}
              onChange={(e) => set({ targetReps: e.target.value === "" ? "" : Number(e.target.value) })} style={numStyle} />
          </Field>
        )}

        {/* Only the extras the chosen protocol uses. */}
        {!draft.timeBased && draft.protocol === "negativas" && (
          <Field label={t("negatives")}>
            <input type="number" className="mono" value={draft.targetNegatives ?? ""}
              onChange={(e) => set({ targetNegatives: e.target.value === "" ? "" : Number(e.target.value) })} style={numStyle} />
          </Field>
        )}
        {!draft.timeBased && draft.protocol === "rest_pause" && (
          <>
            <Field label="+ RP">
              <input type="number" className="mono" value={draft.targetExtra1 ?? ""}
                onChange={(e) => set({ targetExtra1: e.target.value === "" ? "" : Number(e.target.value) })} style={numStyle} />
            </Field>
            <Field label="+ RP">
              <input type="number" className="mono" value={draft.targetExtra2 ?? ""}
                onChange={(e) => set({ targetExtra2: e.target.value === "" ? "" : Number(e.target.value) })} style={numStyle} />
            </Field>
          </>
        )}
      </div>

      <div style={{ display: "flex", gap: 5, marginTop: 6 }}>
        {!slotDef?.isPreagotamiento && !draft.timeBased && (
          <select value={draft.protocol} onChange={(e) => set({ protocol: e.target.value })}
            style={{ ...input, padding: "5px 8px", fontSize: px(12), flex: 1, minWidth: 0 }}>
            <option value="fallo">{tx(PROTOCOLS.fallo.label)}</option>
            <option value="rest_pause">{tx("Rest-pause")}</option>
            <option value="negativas">{tx("Negatives")}</option>
            <option value="submax">{tx("Sub-maximal (not to failure)")}</option>
          </select>
        )}
        <input value={draft.note || ""} placeholder={t("note")}
          onChange={(e) => set({ note: e.target.value })}
          style={{ ...input, padding: "5px 8px", fontSize: px(12), flex: 1, minWidth: 0 }} />
      </div>
    </div>
  );
}

function LogSession({ routineKey, config, workouts, level, inline, onCancel, onFinish, onSaveTargets }) {
  const base = getRoutines(level)[routineKey];
  const groups = getGroups(routineKey, level);
  const roomFactor = !inline ? 1 : (config.length <= 2 ? 1.3 : config.length === 3 ? 1.15 : config.length === 4 ? 1.05 : 1);
  const lp = (n) => px(Math.round(n * roomFactor));
  const [entries, setEntries] = useState(config.map((s) => ({
    slotId: s.slotId, exercise: s.exercise, protocol: s.protocol, timeBased: s.timeBased, weightUnit: s.weightUnit || "kg",
    weight: "", reps: "", negatives: "", repsBreakdown: ["", "", ""], seconds: "",
  })));

  const update = (idx, field, val) => {
    const next = entries.slice();
    next[idx] = { ...next[idx], [field]: val };
    setEntries(next);
  };
  const updateBreakdown = (idx, pos, val) => {
    const next = entries.slice();
    const bd = next[idx].repsBreakdown.slice();
    bd[pos] = val;
    next[idx] = { ...next[idx], repsBreakdown: bd };
    setEntries(next);
  };

  return (
    <div className={inline ? "inline-card" : undefined}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexShrink: 0 }}>
        <button onClick={onCancel} style={{ background: "none", border: "none", color: "#8A8D93", cursor: "pointer" }}><X size={lp(20)} /></button>
        <div>
          <span className="disp" style={{ fontSize: lp(18), textTransform: "uppercase" }}>Day {routineKey}</span>
          <div className="disp" style={{ fontSize: lp(13), fontWeight: 700, color: "#C81E3A", textTransform: "uppercase", letterSpacing: 0.6, marginTop: 1 }}>{tx(base.label)}</div>
        </div>
      </div>

      <div className={inline ? "log-body" : undefined}>
      {groups.map((groupIds, gi) => (
        <div key={gi} style={{ ...card, marginBottom: inline ? 6 : 12, padding: inline ? "8px 10px" : undefined, borderLeft: groupIds.length > 1 ? "3px solid #C81E3A" : undefined }}>
          {groupIds.length > 1 && (
            <div className="mono" style={{ fontSize: lp(10), color: "#C81E3A", letterSpacing: 1, marginBottom: inline ? 5 : 10 }}>{t("superset")}</div>
          )}
          {groupIds.map((slotId, si) => {
            const i = config.findIndex((s) => s.slotId === slotId);
            const slot = config[i];
            return (
              <div key={slotId} style={{
                paddingTop: si > 0 ? (inline ? 7 : 12) : 0, marginTop: si > 0 ? (inline ? 7 : 12) : 0,
                borderTop: si > 0 ? "1px solid #2A2D33" : "none",
                /* Wide enough to read the exercise and fill it in on one line. */
                display: inline ? "flex" : "block", alignItems: inline ? "center" : undefined, gap: inline ? 14 : 0,
              }}>
                <div style={{ flex: inline ? 1 : undefined, minWidth: 0 }}>
                  <div className="disp" style={{ fontSize: lp(14), marginBottom: 2 }}>{slot.exercise}</div>
                  <div className="mono" style={{ fontSize: lp(11), color: "#C81E3A", marginBottom: 4 }}>
                    {slot.timeBased ? t("holdToFailure") : tx(PROTOCOLS[slot.protocol].label)} · {t("target")} <MetaRow slot={slot} />{slot.note ? ` · ${slot.note}` : ""}
                  </div>
                  <PrevRecordLine workouts={workouts} routineKey={routineKey} slotId={slotId} />
                </div>
                {!inline && <div style={{ marginTop: 8 }} />}

                <div style={{ display: "flex", gap: 6, width: inline ? 330 : undefined, flexShrink: 0 }}>
                <input type="number" placeholder={slot.weightUnit || "kg"} value={entries[i].weight} onChange={(e) => update(i, "weight", e.target.value)} style={{ ...input, marginBottom: 0, minWidth: 0, width: inline ? 110 : 84, flexShrink: 0, padding: inline ? "7px 8px" : undefined, fontSize: lp(14) }} />

                {slot.timeBased ? (
                  <input type="number" placeholder={t("phSeconds")} value={entries[i].seconds} onChange={(e) => update(i, "seconds", e.target.value)} style={{ ...input, flex: 1, minWidth: 0, fontSize: lp(14) }} />
                ) : slot.protocol === "rest_pause" ? (
                  <div style={{ display: "flex", gap: 6, minWidth: 0, flex: 1 }}>
                    <input type="number" placeholder={t("phPositiveReps")} value={entries[i].repsBreakdown[0]} onChange={(e) => updateBreakdown(i, 0, e.target.value)} style={{ ...input, flex: 1, minWidth: 0, fontSize: lp(14) }} />
                    <input type="number" placeholder="+15s" value={entries[i].repsBreakdown[1]} onChange={(e) => updateBreakdown(i, 1, e.target.value)} style={{ ...input, flex: 1, minWidth: 0, fontSize: lp(14) }} />
                    <input type="number" placeholder="+15s" value={entries[i].repsBreakdown[2]} onChange={(e) => updateBreakdown(i, 2, e.target.value)} style={{ ...input, flex: 1, minWidth: 0, fontSize: lp(14) }} />
                  </div>
                ) : (
                  <div style={{ display: "flex", gap: 6, flex: 1, minWidth: 0 }}>
                    <input type="number" placeholder={t("phPositiveReps")} value={entries[i].reps} onChange={(e) => update(i, "reps", e.target.value)} style={{ ...input, marginBottom: 0, flex: 1, minWidth: 0, fontSize: lp(14) }} />
                    {slot.protocol === "negativas" && (
                      <input type="number" placeholder={t("phNegativeReps")} value={entries[i].negatives} onChange={(e) => update(i, "negatives", e.target.value)} style={{ ...input, flex: 1, minWidth: 0, fontSize: lp(14) }} />
                    )}
                  </div>
                )}
                </div>
              </div>
            );
          })}
        </div>
      ))}
      </div>

      {/* Same figures, two destinations: the history, or the day's targets. */}
      <div style={{ display: "flex", gap: 8, marginTop: 6, flexShrink: 0 }}>
        <button onClick={() => {
          const cleaned = entries.map((e) => ({
            ...e,
            reps: e.timeBased ? 0 : (e.protocol === "rest_pause" ? e.repsBreakdown.reduce((s, r) => s + (Number(r) || 0), 0) : Number(e.reps) || 0),
          }));
          onFinish(routineKey, cleaned);
        }} style={{ ...btnPrimary, flex: 1, minWidth: 0, padding: "11px 10px", fontSize: lp(13) }}>
          <Check size={lp(16)} /> {t("finishSession")}
        </button>
        <button onClick={() => onSaveTargets(routineKey, entries)}
          style={{ ...btnPrimary, flex: 1, minWidth: 0, padding: "11px 10px", fontSize: lp(13) }}>
          <Settings2 size={lp(16)} /> {t("saveAsTarget")}
        </button>
      </div>
    </div>
  );
}

// ---------------- FOOD ----------------
function Food({ mealPlans, setMealPlans }) {
  const [openPlan, setOpenPlan] = useState(null);
  const isWide = useIsWide();
  const [fitOuter, fitInner, fitScale] = useFitScale(JSON.stringify(mealPlans));

  if (openPlan) {
    return <MealPlanDetail planKey={openPlan} plan={mealPlans[openPlan] || { label: "", items: [] }} allPlans={mealPlans} setMealPlans={setMealPlans} onBack={() => setOpenPlan(null)} />;
  }

  const dayTotals = MEAL_KEYS.reduce((acc, key) => {
    ((mealPlans[key] && mealPlans[key].items) || []).forEach((it) => {
      acc.kcal += Number(it.calories) || 0;
      acc.carbs += Number(it.carbs) || 0;
      acc.protein += Number(it.protein) || 0;
      acc.fat += Number(it.fat) || 0;
      acc.fiber += Number(it.fiber) || 0;
    });
    return acc;
  }, { kcal: 0, carbs: 0, protein: 0, fat: 0, fiber: 0 });

  return (
    <div className={isWide ? "food-screen" : undefined}>
      {/* Mobile: the four meals fill one screen and the total sits below the
          fold on purpose. Desktop: everything shares one screen, no scrolling. */}
      {/* Ends short of the nav bar so meal D doesn't sit flush against it. */}
      <div ref={isWide ? undefined : fitOuter} className={isWide ? "wide-grid" : "fill-screen"}
        style={isWide ? undefined : { height: "calc(100dvh - var(--hd-header) - var(--hd-nav) - var(--hd-mainpad) - 28px)" }}>
      <div ref={isWide ? undefined : fitInner}
        style={isWide ? undefined : { zoom: fitScale, height: `calc(100% / ${fitScale})`, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
      {isWide ? MEAL_KEYS.map((key) => (
        <div key={key} style={{ ...card, padding: "10px 12px" }}>
          <MealPlanDetail
            planKey={key} plan={mealPlans[key] || { label: "", items: [] }}
            allPlans={mealPlans} setMealPlans={setMealPlans} inline
          />
        </div>
      )) : MEAL_KEYS.map((key) => {
        const plan = mealPlans[key] || { label: "", items: [] };
        const tot = (plan.items || []).reduce((acc, m) => {
          acc.kcal += Number(m.calories) || 0;
          acc.carbs += Number(m.carbs) || 0;
          acc.protein += Number(m.protein) || 0;
          acc.fat += Number(m.fat) || 0;
          acc.fiber += Number(m.fiber) || 0;
          return acc;
        }, { kcal: 0, carbs: 0, protein: 0, fat: 0, fiber: 0 });
        return (
          <button key={key} onClick={() => setOpenPlan(key)} className={isWide ? undefined : "grow"}
            style={{ ...card, padding: isWide ? "10px 12px" : "8px 10px", marginBottom: isWide ? 0 : 8, width: "100%", textAlign: "left", cursor: "pointer", display: "block" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span className="disp" style={{ fontSize: px(16), fontWeight: 700, textTransform: "uppercase" }}>{t("meal")} {key}{plan.label ? <span className="mono" style={{ fontSize: px(11), color: "#8A8D93", textTransform: "none", fontWeight: 400 }}> · {plan.label}</span> : null}</span>
              <ChevronRight size={px(16)} color="#8A8D93" style={{ flexShrink: 0 }} />
            </div>
            {(plan.items || []).length === 0 ? (
              <div className="mono" style={{ fontSize: px(11), color: "#8A8D93", marginTop: 6 }}>{t("noFoodsLogged")}</div>
            ) : (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginTop: 3, gap: 10 }}>

// One food, editable in place. The name field doubles as the database search:
// picking a suggestion fills the macros, and changing the amount rescales them.
// "250 g" -> { num: "250", suffix: "g" }. Shared by both editors.
function splitAmount(a) {
  const s = String(a || "").trim();
  const m = s.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
  return m ? { num: m[1], suffix: m[2] } : { num: "", suffix: s };
}

function FoodRowEditor({ item, compact, onChange, onDelete, onDone }) {
  const [draft, setDraft] = useState(item);
  const [query, setQuery] = useState("");

  // The amount is split so the unit is shown beside the field instead of being
  // typed into it, and so the quantity stays a plain number to compute with.
  const parsed = splitAmount(item.amount);
  const [qty, setQty] = useState(parsed.num);
  const [unit, setUnit] = useState(parsed.suffix || "g");

  // Reference point for rescaling: the macros as they stand at a known quantity.
  // Works for a food picked from the database and for one typed by hand.
  const [base, setBase] = useState({
    qty: parseFloat(parsed.num) || 0,
    macros: { calories: item.calories, carbs: item.carbs, protein: item.protein, fat: item.fat, fiber: item.fiber },
  });

  const commit = (patch, q = qty, u = unit) => {
    const amount = q === "" ? "" : (u ? `${q} ${u}` : String(q));
    const next = { ...draft, ...patch, amount };
    setDraft(next);
    onChange(next);
  };

  const pick = (f) => {
    const q = f.u === "u" ? "1" : "100";
    const u = f.u === "u" ? "" : "g";
    const macros = scaleFood(f, Number(q));
    setQuery("");
    setQty(q);
    setUnit(u);
    setBase({ qty: Number(q), macros });
    commit({ name: foodLabel(f), ...macros }, q, u);
  };

  const onQty = (val) => {
    setQty(val);
    const n = parseFloat(String(val).replace(",", "."));
    if (isNaN(n) || !base.qty) return commit({}, val, unit);
    const factor = n / base.qty;
    commit({
      calories: Math.round((base.macros.calories || 0) * factor),
      carbs: n1((base.macros.carbs || 0) * factor),
      protein: n1((base.macros.protein || 0) * factor),
      fat: n1((base.macros.fat || 0) * factor),
      fiber: n1((base.macros.fiber || 0) * factor),
    }, val, unit);
  };

  // A macro edited by hand becomes the new reference for further rescaling.
  const setMacro = (k, v) => {
    const value = n1(v);
    const next = { ...draft, [k]: value };
    setDraft(next);
    onChange(next);
    setBase({
      qty: parseFloat(String(qty).replace(",", ".")) || base.qty,
      macros: { calories: next.calories, carbs: next.carbs, protein: next.protein, fat: next.fat, fiber: next.fiber },
    });
  };

  const num = { ...input, padding: compact ? "9px 6px" : "5px 6px", fontSize: compact ? 14 : 12, width: "100%", textAlign: "center" };
  const hits = searchFoods(query);

  return (
    <div style={{ ...card, marginBottom: compact ? 6 : 3, padding: compact ? "10px 12px" : "8px 10px", border: "1px solid #C81E3A" }}>
      {/* On a phone there is no room for one row: the name takes a line of its
          own and the amount shares the next one with the actions. */}
      <div style={{ display: "flex", gap: 6, alignItems: "center", position: "relative", flexWrap: compact ? "wrap" : "nowrap" }}>
        <input
          autoFocus
          value={query || draft.name}
          placeholder={t("phFood")}
          onChange={(e) => { setQuery(e.target.value); commit({ name: e.target.value }); }}
          style={{ ...input, padding: compact ? "9px 11px" : "5px 8px", fontSize: px(14), flex: compact ? "1 0 100%" : 1, minWidth: 0, marginBottom: compact ? 6 : 0 }}
        />
        {/* The field holds the number only; the unit is shown next to it. */}
        <div style={{ position: "relative", width: compact ? 110 : px(86), flexShrink: 0 }}>
          <input
            type="number"
            className="mono"
            value={qty}
            placeholder={t("amount")}
            onChange={(e) => onQty(e.target.value)}
            style={{ ...input, padding: compact ? "9px 26px 9px 11px" : "5px 24px 5px 8px", fontSize: px(13), width: "100%" }}
          />
          {unit && (
            <span className="mono" style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", fontSize: px(11), color: "#8A8D93", pointerEvents: "none" }}>{unit}</span>
          )}
        </div>
        <button onClick={onDone} style={{ background: "none", border: "none", color: "#C81E3A", cursor: "pointer", padding: compact ? 8 : 4, marginLeft: compact ? "auto" : 0 }}><Check size={compact ? 20 : 17} /></button>
        <button onClick={onDelete} style={{ background: "none", border: "none", color: "#8A8D93", cursor: "pointer", padding: compact ? 8 : 4 }}><Trash2 size={compact ? 18 : 16} /></button>

        {query.trim() !== "" && hits.length > 0 && (
          <div style={{ position: "absolute", left: 0, right: 0, top: "100%", zIndex: 30, marginTop: 2,
                        background: "#1E2126", border: "1px solid #C81E3A", maxHeight: 190, overflowY: "auto" }}>
            {hits.map((f) => (
              <button key={f.n} onClick={() => pick(f)}
                style={{ display: "block", width: "100%", textAlign: "left", background: "none",
                         border: "none", borderBottom: "1px solid #2A2D33", padding: "7px 10px", cursor: "pointer" }}>
                <div className="disp" style={{ fontSize: px(13) }}>{foodLabel(f)}</div>
                <div className="mono" style={{ fontSize: px(10), color: "#8A8D93", marginTop: 1 }}>
                  {f.k} kcal · C {f.c} · P {f.p} · F {f.f} — {f.u === "u" ? t("perUnit") : t("per100")}
                </div>
              </button>
            ))}
          </div>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: compact ? "repeat(3, 1fr)" : "repeat(5, 1fr)", gap: compact ? 7 : 5, marginTop: compact ? 9 : 6 }}>
        {[["calories", "kcal"], ["carbs", "C"], ["protein", "P"], ["fat", "F"], ["fiber", "Fb"]].map(([k, lbl]) => (
          <label key={k} style={{ display: "block" }}>
            <span className="mono" style={{ fontSize: compact ? 10 : 9, color: "#8A8D93", display: "block", textAlign: "center", marginBottom: 1 }}>{lbl}</span>
            <input type="number" className="mono" value={draft[k] ?? ""} onChange={(e) => setMacro(k, e.target.value)} style={num} />
          </label>
        ))}
      </div>
    </div>
  );
}

function MealPlanDetail({ planKey, plan, allPlans, setMealPlans, inline, onBack }) {
  const [openRow, setOpenRow] = useState(null);
  const [label, setLabel] = useState(plan.label);
  const items = plan.items || [];

  const totals = items.reduce((acc, m) => {
    acc.kcal += Number(m.calories) || 0;
    acc.carbs += Number(m.carbs) || 0;
    acc.protein += Number(m.protein) || 0;
    acc.fat += Number(m.fat) || 0;
    acc.fiber += Number(m.fiber) || 0;
    return acc;
  }, { kcal: 0, carbs: 0, protein: 0, fat: 0, fiber: 0 });

  const persist = async (next, newLabel) => {
    await setMealPlans({ ...allPlans, [planKey]: { label: newLabel ?? plan.label, items: next } });
  };

  // Every edit writes straight through: no edit mode, no separate form.
  const patchItem = (next) => persist(items.map((m) => (m.id === next.id ? next : m)));
  const removeItem = (id) => persist(items.filter((m) => m.id !== id));
  const addBlankItem = async () => {
    const blank = { id: "mi" + Date.now(), name: "", amount: "", calories: 0, carbs: 0, protein: 0, fat: 0, fiber: 0, notes: "" };
    await persist([...items, blank]);
    setOpenRow(blank.id);
  };

  return (
    <div className={inline ? "inline-card" : undefined}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: inline ? 7 : 12, flexShrink: 0 }}>
        {!inline && (
          <button onClick={onBack} style={{ background: "none", border: "none", color: "#8A8D93", cursor: "pointer" }}><X size={px(20)} /></button>
        )}
        <span className="disp" style={{ fontSize: inline ? 17 : 18, textTransform: "uppercase", flexShrink: 0 }}>{t("meal")} {planKey}</span>
        <input
          value={label}
          placeholder={t("phLabel")}
          onChange={(e) => setLabel(e.target.value)}
          onBlur={() => persist(items, label)}
          className="disp"
          style={{ background: "none", border: "none", color: "#8A8D93", fontSize: px(14), flex: 1, minWidth: 0, padding: 0, outline: "none" }}
        />
        <button onClick={addBlankItem} title={t("addFood")}
          style={{ background: "none", border: "1px solid #3A3F47", color: "#8A8D93", cursor: "pointer", padding: "3px 8px", display: "flex", alignItems: "center", gap: 5, flexShrink: 0 }}>
          <Plus size={px(15)} /><span className="disp" style={{ fontSize: px(11), textTransform: "uppercase" }}>{t("add")}</span>
        </button>
      </div>

      <div className={inline ? "inline-scroll" : undefined}>
        {items.length === 0 && <p className="mono" style={{ color: "#8A8D93", fontSize: px(12) }}>{t("noFoodsYet")}</p>}
        {items.map((m) => (
          openRow === m.id ? (
            <FoodRowEditor
              key={m.id} item={m} compact={!inline}
              onChange={patchItem}
              onDelete={() => { setOpenRow(null); removeItem(m.id); }}
              onDone={() => setOpenRow(null)}
            />
          ) : (
            <div key={m.id} onClick={() => setOpenRow(m.id)}
              style={{ ...card, marginBottom: inline ? 3 : 6, padding: inline ? "5px 10px" : "9px 12px", cursor: "pointer" }}>
              {inline ? (
                <div style={{ display: "flex", alignItems: "baseline", gap: 10, minWidth: 0 }}>
                  <span className="disp" style={{ fontSize: px(15), flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "45%", color: m.name ? undefined : "#8A8D93" }}>
                    {m.name || t("phFood")}
                    {m.amount ? <span className="mono" style={{ fontSize: px(12), color: "#8A8D93" }}> · {m.amount}</span> : ""}
                  </span>
                  {m.calories > 0 && (
                    <span className="mono" style={{ fontSize: px(13), color: "#8A8D93", whiteSpace: "nowrap", marginLeft: "auto" }}>
                      {Math.round(m.calories)} kcal · C {n1(m.carbs)} · P {n1(m.protein)} · F {n1(m.fat)} · Fb {n1(m.fiber)}
                    </span>
                  )}
                </div>
              ) : (
                <>
                  <div className="disp" style={{ fontSize: px(14), color: m.name ? undefined : "#8A8D93" }}>
                    {m.name || t("phFood")}
                    {m.amount ? <span className="mono" style={{ fontSize: px(12), color: "#8A8D93" }}> · {m.amount}</span> : ""}
                  </div>
                  {m.calories > 0 && (
                    <div className="mono" style={{ fontSize: px(12), color: "#8A8D93", marginTop: 2 }}>
                      {Math.round(m.calories)} kcal · C {n1(m.carbs)}g · P {n1(m.protein)}g · F {n1(m.fat)}g · Fb {n1(m.fiber)}g
                    </div>
                  )}
                </>
              )}
            </div>
          )
        ))}
      </div>

      {/* Totals live at the foot of the meal: at the top they pushed the food
          list down for a figure that only makes sense after reading it. */}
      <div className="mono" style={{
        marginTop: inline ? 7 : 10, paddingTop: inline ? 7 : 9, borderTop: "1px solid #2A2D33", flexShrink: 0,
        display: "flex", alignItems: "baseline", gap: 14, flexWrap: "wrap", fontSize: px(14),
      }}>
        <span style={{ fontSize: px(17), fontWeight: 600, color: "#C81E3A" }}>{Math.round(totals.kcal)} kcal</span>
        <span style={{ color: "#E8E6E1" }}><span style={{ color: "#8A8D93" }}>C </span>{n1(totals.carbs)}g</span>
        <span style={{ color: "#E8E6E1" }}><span style={{ color: "#8A8D93" }}>P </span>{n1(totals.protein)}g</span>
        <span style={{ color: "#E8E6E1" }}><span style={{ color: "#8A8D93" }}>F </span>{n1(totals.fat)}g</span>
        <span style={{ color: "#E8E6E1" }}><span style={{ color: "#C81E3A" }}>F </span>{n1(totals.fiber)}g</span>
      </div>
    </div>
  );
}

function Progress({ workouts, bodystats, setBodystats }) {
  const [sub, setSub] = useState("performance");

  return (
    <div className={isWide ? "prog-screen" : undefined}>
      <div style={{ display: "flex", gap: 8, marginBottom: 16, flexShrink: 0 }}>

function SubTab({ label, active, onClick }) {
  return (
    <button onClick={onClick} style={{ flex: 1, background: active ? "#C81E3A" : "#1E2126", color: active ? "#fff" : "#8A8D93", border: "1px solid " + (active ? "#C81E3A" : "#2A2D33"), padding: "9px 6px", fontFamily: "'Oswald', sans-serif", fontSize: px(11), textTransform: "uppercase", letterSpacing: 0.5, cursor: "pointer" }}>
      {label}
    </button>
  );
}

function BodyComposition({ bodystats, setBodystats }) {
  const isWide = useIsWide();
  const [weight, setWeight] = useState("");
  const [bodyFat, setBodyFat] = useState("");
  const [height, setHeight] = useState("190");

  const addEntry = async () => {
    if (!weight || !bodyFat) return;
    await setBodystats([...bodystats, { id: "b" + Date.now(), date: new Date().toISOString().slice(0, 10), weight: Number(weight), bodyFat: Number(bodyFat) }]);
    setWeight(""); setBodyFat("");
  };

  const heightM = Number(height) / 100;
  const ffmiData = bodystats.map((b) => {
    const lean = b.weight * (1 - b.bodyFat / 100);
    const ffmi = heightM ? lean / (heightM * heightM) + 6.1 * (1.8 - heightM) : null;
    return { ...b, lean: Math.round(lean * 10) / 10, ffmi: ffmi ? Math.round(ffmi * 10) / 10 : null, label: fmtDate(b.date) };
  });
  const latestCalc = ffmiData[ffmiData.length - 1];

  return (
    <div className={isWide ? "split-layout" : undefined}>
      <div className={isWide ? "split-left" : undefined}>
      <div style={card}>
        <input type="number" placeholder={t("height")} value={height} onChange={(e) => setHeight(e.target.value)} style={{ ...input, marginBottom: 8 }} />
        <div style={{ display: "flex", gap: 10 }}>
          <input type="number" placeholder={t("phWeightKg")} value={weight} onChange={(e) => setWeight(e.target.value)} style={{ ...input, flex: 1 }} />
          <input type="number" placeholder={t("bodyFat")} value={bodyFat} onChange={(e) => setBodyFat(e.target.value)} style={{ ...input, flex: 1 }} />
        </div>
        <button onClick={addEntry} style={{ ...btnPrimary, width: "100%", marginTop: 10 }}><Plus size={px(16)} /> {t("logMeasurement")}</button>
      </div>

      {latestCalc && (
        <div style={{ display: "flex", gap: 10, marginTop: isWide ? 0 : 16 }}>
          <StatCard value={latestCalc.lean} label={t("leanMassKg")} />
          <StatCard value={latestCalc.ffmi ?? "—"} label="FFMI" />
        </div>
      )}

      {ffmiData.length >= 2 && CHARTS_OK ? (
        <div className={isWide ? "chart-fill" : undefined} style={{ ...card, padding: "18px 8px 8px", marginTop: isWide ? 0 : 16 }}>
          <div className="mono" style={{ fontSize: px(11), color: "#8A8D93", padding: "0 8px 8px" }}>{t("bodyWeightKg")}</div>
          <div className={isWide ? "chart-area" : undefined}>
          <ResponsiveContainer width="100%" height={isWide ? "100%" : 180}>
            <LineChart data={ffmiData}>
              <CartesianGrid stroke="#2A2D33" vertical={false} />
              <XAxis dataKey="label" stroke="#8A8D93" fontSize={10} />
              <YAxis stroke="#8A8D93" fontSize={10} domain={["dataMin - 2", "dataMax + 3"]} />
              <Tooltip contentStyle={{ background: "#1E2126", border: "1px solid #2A2D33", fontSize: px(12) }} labelStyle={{ color: "#E8E6E1" }} />
              <Line type="monotone" dataKey="weight" stroke="#C81E3A" strokeWidth={2} dot={{ fill: "#C81E3A", r: 3 }}>
                {LabelList && (
                  <LabelList dataKey="weight" position="top" offset={8}
                    style={{ fill: "#E8E6E1", fontSize: 10, fontFamily: "'JetBrains Mono', monospace" }} />
                )}
              </Line>
            </LineChart>
          </ResponsiveContainer>
          </div>
        </div>
      ) : (
        <p className="mono" style={{ color: "#8A8D93", fontSize: px(12), textAlign: "center", padding: 24 }}>{t("needTwoMeasurements")}</p>
      )}

      </div>

      {ffmiData.length > 0 && (
        <div className={isWide ? "side-col" : undefined} style={{ marginTop: isWide ? 0 : 16 }}>
          <SectionLabel>{t("measurementHistory")}</SectionLabel>
          {ffmiData.slice().reverse().map((b) => (
            <div key={b.id} style={{ ...card, marginBottom: 8, padding: "12px 14px" }}>
              <div className="mono" style={{ fontSize: px(11), color: "#8A8D93" }}>{fmtDate(b.date)}</div>
              {/* Weight sits in the same grid as the other figures: on its own
                  line it read as belonging to the date rather than the data.
                  Fixed columns keep values lined up despite varying decimals. */}
              <div className="mono" style={{ fontSize: px(12), color: "#E8E6E1", marginTop: 5, display: "grid", gridTemplateColumns: "1fr 1fr", rowGap: 3, columnGap: 6 }}>
                <span style={{ color: "#C81E3A" }}><span style={{ color: "#8A8D93" }}>{t("weight")} </span>{b.weight}kg</span>
                <span><span style={{ color: "#8A8D93" }}>{t("fatShort")} </span>{b.bodyFat}%</span>
                <span><span style={{ color: "#8A8D93" }}>{t("leanShort")} </span>{b.lean}kg</span>
                <span>{b.ffmi ? <><span style={{ color: "#8A8D93" }}>FFMI </span>{b.ffmi}</> : ""}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StatCard({ value, label }) {
  return (
    <div style={{ ...card, flex: 1, textAlign: "center", padding: 16 }}>
      <div className="mono" style={{ fontSize: px(24), fontWeight: 600, color: "#C81E3A" }}>{value}</div>
      <div className="disp" style={{ fontSize: px(10), color: "#8A8D93", textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</div>
    </div>
  );
}

function Performance({ workouts }) {
  const isWide = useIsWide();
  const allExercises = useMemo(() => {
    const set = new Set();
    workouts.forEach((w) => w.entries.forEach((e) => { if (e.weight) set.add(e.exercise); }));
    return Array.from(set);
  }, [workouts]);
  const [exercise, setExercise] = useState("");

  useEffect(() => { if (!exercise && allExercises.length) setExercise(allExercises[0]); }, [allExercises]);

  const points = useMemo(() => {
    const pts = [];
    workouts.slice().sort((a, b) => new Date(a.date) - new Date(b.date)).forEach((w) => {
      const match = w.entries.find((e) => e.exercise === exercise && e.weight);
      if (match) {
        const weight = Number(match.weight);
        const timeBased = !!match.timeBased;
        const reps = Number(match.reps) || 1;
        const seconds = Number(match.seconds) || 0;
        const oneRM = timeBased ? null : Math.round(weight * (1 + reps / 30) * 10) / 10;
        pts.push({ date: w.date, weight, reps, seconds, oneRM, timeBased, weightUnit: match.weightUnit || "kg", label: fmtDate(w.date), protocol: match.protocol, negatives: match.negatives, repsBreakdown: match.repsBreakdown });
      }
    });
    return pts;
  }, [workouts, exercise]);

  if (allExercises.length === 0) return <p className="mono" style={{ color: "#8A8D93", fontSize: px(12), textAlign: "center", padding: 30 }}>{t("logFirst")}</p>;

  const isTimeBased = points.length > 0 && points[0].timeBased;
  const unit = points.length > 0 ? points[0].weightUnit : "kg";

  return (
    <div className={isWide ? "split-layout" : undefined}>
      <div className={isWide ? "split-left" : undefined}>
      <select value={exercise} onChange={(e) => setExercise(e.target.value)} style={{ ...input, marginBottom: isWide ? 0 : 16 }}>
        {allExercises.map((ex) => <option key={ex} value={ex}>{ex}</option>)}
      </select>
      {points.length >= 2 && CHARTS_OK ? (
        <div className={isWide ? "chart-fill" : undefined} style={{ ...card, padding: "18px 8px 8px" }}>
          <div className="mono" style={{ fontSize: px(11), color: "#8A8D93", padding: "0 8px 8px" }}>{isTimeBased ? t("secondsHeld") : `${t("theoretical1RM")} (${unit.toUpperCase()})`}</div>
          <div className={isWide ? "chart-area" : undefined}>
          <ResponsiveContainer width="100%" height={isWide ? "100%" : 200}>
            <LineChart data={points}>
              <CartesianGrid stroke="#2A2D33" vertical={false} />
              <XAxis dataKey="label" stroke="#8A8D93" fontSize={10} />
              <YAxis stroke="#8A8D93" fontSize={10} domain={["dataMin - 5", "dataMax + 8"]} />
              <Tooltip contentStyle={{ background: "#1E2126", border: "1px solid #2A2D33", fontSize: px(12) }} labelStyle={{ color: "#E8E6E1" }} formatter={(v, n) => n === "oneRM" ? [`${v} ${unit}`, "Theoretical 1RM"] : n === "seconds" ? [`${v}s`, "Seconds"] : [v, n]} />
              <Line type="monotone" dataKey={isTimeBased ? "seconds" : "oneRM"} stroke="#C81E3A" strokeWidth={2} dot={{ fill: "#C81E3A", r: 3 }}>
                {LabelList && (
                  <LabelList dataKey={isTimeBased ? "seconds" : "oneRM"} position="top" offset={8}
                    style={{ fill: "#E8E6E1", fontSize: 10, fontFamily: "'JetBrains Mono', monospace" }} />
                )}
              </Line>
            </LineChart>
          </ResponsiveContainer>
          </div>
        </div>
      ) : (
        <p className="mono" style={{ color: "#8A8D93", fontSize: px(12), textAlign: "center", padding: 24 }}>{t("needTwoSessions")}</p>
      )}

      </div>

      {points.length > 0 && (
        <div className={isWide ? "side-col" : undefined} style={{ marginTop: isWide ? 0 : 16 }}>
          <SectionLabel>{t("historyFor")} {shortName(exercise)}</SectionLabel>
          {points.slice().reverse().map((p, i) => (
            <div key={i} style={{ ...card, marginBottom: 8, padding: "12px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span className="mono" style={{ fontSize: px(11), color: "#8A8D93" }}>{fmtDateTime(p.date)}</span>
                <span className="mono" style={{ fontSize: px(12), color: "#C81E3A" }}>{p.timeBased ? `${p.seconds}s` : `1RM ${p.oneRM}${p.weightUnit}`}</span>
              </div>
              <div className="mono" style={{ fontSize: px(12), color: "#E8E6E1", marginTop: 4 }}>
                {p.weight}{p.weightUnit} · {p.timeBased
                  ? `${p.seconds}s (hold)`
                  : p.protocol === "rest_pause" && p.repsBreakdown
                  ? `${p.repsBreakdown.filter((r) => r).join(" + ")} reps (rest-pause)`
                  : `${p.reps} ${t("positive")}${p.negatives ? ` + ${p.negatives} ${t("slowNegatives")}` : ""}`}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------------- BOOKS & THEORY ----------------
function Books({ notes, setNotes }) {
  const [draft, setDraft] = useState(notes);
  const saveNotes = async () => await setNotes(draft);

  return (
    <div>
      <SectionLabel>{t("methodPrinciples")}</SectionLabel>
      {principles().map((p, i) => (
        <div key={i} style={{ ...card, marginBottom: 8, padding: "12px 14px" }}>
          <p className="mono" style={{ fontSize: px(12), color: "#E8E6E1", lineHeight: 1.6, margin: 0 }}>{p}</p>
        </div>
      ))}

      <div style={{ marginTop: 18 }}>
        <SectionLabel>{t("recommended")}</SectionLabel>
        {books().map((b, i) => (
          <div key={i} style={{ ...card, marginBottom: 8 }}>
            <div className="disp" style={{ fontSize: px(14), textTransform: "uppercase" }}>{b.title}</div>
            <div className="mono" style={{ fontSize: px(11), color: "#C81E3A", margin: "2px 0 6px" }}>{b.author}</div>
            <p className="mono" style={{ fontSize: px(12), color: "#8A8D93", lineHeight: 1.5, margin: 0 }}>{b.note}</p>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 18 }}>
        <SectionLabel>{t("yourNotes")}</SectionLabel>
        <div style={card}>
          <textarea value={draft} onChange={(e) => setDraft(e.target.value)} placeholder={t("notesPlaceholder")} style={{ ...input, minHeight: 100, resize: "vertical" }} />
          <button onClick={saveNotes} style={{ ...btnGhost, width: "100%", marginTop: 10 }}>{t("saveNotes")}</button>
        </div>
      </div>
    </div>
  );
}

function SectionLabel({ children }) {
  return <div className="disp" style={{ fontSize: px(13), letterSpacing: 1.5, color: "#8A8D93", textTransform: "uppercase", marginBottom: 12 }}>{children}</div>;
}

const card = { background: "#1E2126", border: "1px solid #2A2D33", padding: 14 };
const input = { width: "100%", background: "#14161A", border: "1px solid #3A3F47", color: "#E8E6E1", padding: "10px 12px", fontSize: px(14) };
const btnPrimary = { background: "#C81E3A", color: "#fff", border: "none", padding: "12px 20px", display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8, fontFamily: "'Oswald', sans-serif", fontWeight: 600, letterSpacing: 0.5, cursor: "pointer" };
const btnGhost = { background: "none", color: "#8A8D93", border: "1px solid #3A3F47", padding: "12px 20px", fontFamily: "'Oswald', sans-serif", fontWeight: 600, letterSpacing: 0.5, cursor: "pointer" };

// ---------------- MOUNT ----------------
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

<script>
  var boot = document.getElementById('boot');
  var waited = 0;
  var check = setInterval(function () {
    if (document.getElementById('root').childElementCount > 0) {
      if (boot) boot.remove();
      clearInterval(check);
      return;
    }
    waited += 200;
    if (waited >= 8000 && window.__errors.length === 0) {
      clearInterval(check);
      var missing = [];
      if (!window.React) missing.push('React');
      if (!window.ReactDOM) missing.push('ReactDOM');
      if (!window.Babel) missing.push('Babel');
      if (!window.Recharts) missing.push('Recharts (charts only)');
      showError('App did not start after 8s',
        missing.length ? 'Missing libraries: ' + missing.join(', ') : 'Libraries loaded but the app did not render.');
    }
  }, 200);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW failed', e); });
    });
  }
</script>
</body>
</html>
